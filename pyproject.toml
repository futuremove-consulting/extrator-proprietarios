[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "extrator-prop"
version = "0.1.0"
description = "Modulo de extracao e validacao de proprietarios imobiliarios"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Future Move Consulting"}
]
keywords = ["real-estate", "property", "extraction", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.0",
    "ruff>=0.5",
]

[project.scripts]
extrair-proprietarios = "extrator_prop.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/extrator_prop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py310"
