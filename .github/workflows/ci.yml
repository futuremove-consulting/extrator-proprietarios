# GitHub Actions CI
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instala pacote + tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build pip-audit
      - name: Testes
        run: pytest
      - name: Build wheel
        run: python -m build --wheel
      - name: Lint (informativo ate zerar os 113 achados)
        run: ruff check . --output-format=concise
        continue-on-error: true
      - name: Typecheck (informativo ate resolver os 23 erros)
        run: mypy src/
        continue-on-error: true
      - name: Audit de dependencias (informativo)
        run: pip-audit
        continue-on-error: true
